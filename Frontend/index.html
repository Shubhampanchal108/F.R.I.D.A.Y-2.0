<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.R.I.D.A.Y</title>
    <link rel="shortcut icon" href="./public/Friday.jpg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./stylesheets/style.css">
    <link rel="stylesheet" href="./stylesheets/style_2.css">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <header class="header">
        <h1>F.R.I.D.A.Y</h1>
        <p class="left-panel" style="margin-bottom: 20px;">Friendly Reliable Intelligent Digital Assitant for Youth</p>
        <div style="display: flex; align-items: center;">
            <div class="time-display">
                <div class="time" id="current-time"></div>
                <div class="date" id="current-date"></div>
            </div>
            <div class="status-indicator" id="listening-indicator"></div>
        </div>
    </header>

    <div class="container">
        <!-- LEFT PANEL -->
        <div class="panel left-panel">
            <div class="panel-header">System Status</div>
            <div id="system-status-container"></div>

            <div class="panel-header">Quick Actions</div>
            <div class="quick-actions">
                <button class="btn">Chats</button>
                <button class="btn">Settings</button>
                <button class="btn">Tasks</button>
                <button class="btn">Profile</button>
            </div>

            <!-- Conversation Log moved here -->
            <div class="panel-header">Conversation Log</div>
            <div class="conversation-log">
                <div class="log-container" id="log-container"></div>
                <div class="">
                    <input type="text" placeholder="Type Here.." class="Input">
                    <!-- <button class="send-btn">Send</button> -->
                </div>
            </div>
        </div>

        <!-- MAIN DISPLAY -->
        <div class="main-display">
            <div class="visualizer" id="visualizer">
                <div class="visualizer-core">
                    <!-- <p class="center-name">F.R.I.D.A.Y</p> -->
                </div>
            </div>
        
        
            
        </div>

        <!-- <div class="">dfdfd</div> -->

        <!-- RIGHT PANEL -->
        <div class="panel right-panel">
            <!-- Voice Controls moved here -->
            <div class="panel-header">Voice Controls</div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button id="listen-btn" class="btn">
                    <span id="listen-text">Start Listening</span>
                    
                </button>
                <button id="mute-btn" class="btn" onclick="stopListening()">
                    <span id="mute-text">Mute</span>
                </button>
            </div>

            <div class="panel-header">Status</div>
            <div class="features-list">
                 <div class="feature"><span class="name">Voice Recognition</span><span class="value active">ACTIVE</span></div>
                 <div class="feature"><span class="name">Live Mode</span><span class="value active">DISABLE</span></div>
                 <div class="feature"><span class="name">Screen Mode</span><span class="value active">DISABLE</span></div>
                 <div class="feature"><span class="name">Mobile </span><span class="value active">DISABLE</span></div>
                 <div class="feature"><span class="name">Home TV</span><span class="value active">DISABLE</span></div>
            </div>

            <div class="panel-header">Visual Input</div>
            <div class="camera-feed" id="camera-feed">
                <video id="video-feed" autoplay muted playsinline style="display: none;"></video>
                <div id="camera-placeholder" style="color: var(--text-muted);">Camera Offline</div>
                <div class="live-indicator">LIVE</div>
            </div>
            <button id="camera-btn" class="btn"><span id="camera-text">Start Camera</span></button>
        </div>
    </div>
    <script src="./Js/Engine.js"></script>
    <script src="./Js/Mic_Input.js"></script>
</body>
</html>
